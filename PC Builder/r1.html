<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Round 1: PC Assembly</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1, h2 {
      color: #38bdf8;
    }
    .scenarios {
      margin-bottom: 15px;
    }
    button {
      background: #06b6d4;
      border: none;
      padding: 8px 12px;
      margin: 5px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      color: #fff;
    }
    button:hover {
      background: #0891b2;
    }
    .container {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      gap: 20px;
    }
    .components {
      width: 55%;
      max-height: 550px;
      padding: 10px;
      background: #111827;
      border-radius: 10px;
      overflow-y: auto;
      text-align: left;
    }
    .category {
      margin-bottom: 20px;
    }
    .category h3 {
      margin-bottom: 10px;
      color: #facc15;
      font-size: 18px;
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }
    .component {
      background: #1e293b;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      cursor: grab;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      transition: 0.2s;
    }
    .component:hover {
      border: 2px solid #38bdf8;
      transform: scale(1.05);
    }
    .component img {
      width: 60px;
      height: 60px;
      margin-bottom: 8px;
    }
    .component p {
      margin: 0;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
    }
    .slots {
      width: 40%;
      padding: 15px;
      background: #111827;
      border-radius: 10px;
    }
    .slot {
      margin: 12px;
      padding: 12px;
      background: #1e293b;
      border: 2px dashed #94a3b8;
      border-radius: 8px;
      min-height: 80px;
      color: #94a3b8;
      font-size: 14px;
    }
    .highlight {
      border: 2px solid #38bdf8;
    }
    #result {
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="assembly" class="hidden">
  <h1>🔧 Round 1: PC Assembly</h1>
  <h2>Choose or Get Random Scenario</h2>
  <div class="scenarios">
    <button onclick="loadScenario('1')">Scenario 1</button>
    <button onclick="loadScenario('2')">Scenario 2</button>
    <button onclick="loadScenario('3')">Scenario 3</button>
    <button onclick="loadScenario('4')">Scenario 4</button>
    <button onclick="loadScenario('5')">Scenario 5</button>
    <button onclick="loadScenario('6')">Scenario 6</button>
    <button onclick="loadScenario('7')">Scenario 7</button>
    <button onclick="loadScenario('8')">Scenario 8</button>
    <button onclick="loadScenario('9')">Scenario 9</button>
    <button onclick="loadScenario('10')">Scenario 10</button>
    <button onclick="randomScenario()">🎲 Get Random</button>
  </div>

  <button onclick="checkBuild()">✅ Check Build</button> <button onclick="backToMenu()">⬅ Back to Menu</button>
  <div id="result"></div>
  

  <div class="container">
    <div class="components" id="components">
      <h2>Components</h2>
      <!-- Components load here -->
    </div>
    <div class="slots" id="slots">
      <h2>PC Slots</h2>
      <div class="slot" data-type="CPU">CPU Slot</div>
      <div class="slot" data-type="GPU">GPU Slot</div>
      <div class="slot" data-type="RAM">RAM Slot</div>
      <div class="slot" data-type="Storage">Storage Slot</div>
      <div class="slot" data-type="PSU">PSU Slot</div>
      <div class="slot" data-type="Motherboard">Motherboard Slot</div>
    </div>
  </div>

  
</div>    

  <script>
    // 10 scenarios
    const scenarios = {
      "1": {name: "Entry Gaming", requirements:{CPU:"Intel i5", GPU:"GTX 1660", RAM:"16GB DDR4", Storage:"512GB SSD", PSU:"550W", Motherboard:"B560 DDR4"}},
      "2": {name: "Ultra 4K Gaming", requirements:{CPU:"Intel i9", GPU:"RTX 4090", RAM:"32GB DDR5", Storage:"1TB SSD", PSU:"850W", Motherboard:"Z790 DDR5"}},
      "3": {name: "Budget Office", requirements:{CPU:"Intel i3", GPU:"Integrated Graphics", RAM:"8GB DDR4", Storage:"256GB SSD", PSU:"400W", Motherboard:"H510 DDR4"}},
      "4": {name: "Programming PC", requirements:{CPU:"Ryzen 5", GPU:"Integrated Graphics", RAM:"16GB DDR4", Storage:"512GB SSD", PSU:"500W", Motherboard:"B450 DDR4"}},
      "5": {name: "Video Editing", requirements:{CPU:"Ryzen 9", GPU:"RTX 3080", RAM:"64GB DDR5", Storage:"2TB SSD", PSU:"1000W", Motherboard:"X670 DDR5"}},
      "6": {name: "AI/Machine Learning", requirements:{CPU:"Intel Xeon", GPU:"RTX A6000", RAM:"128GB DDR5", Storage:"2TB SSD", PSU:"1200W", Motherboard:"WS C621"}},
      "7": {name: "Streaming Rig", requirements:{CPU:"Ryzen 7", GPU:"RTX 3070", RAM:"32GB DDR4", Storage:"1TB SSD", PSU:"750W", Motherboard:"X570 DDR4"}},
      "8": {name: "Small Form Factor", requirements:{CPU:"Intel i7", GPU:"RTX 3060", RAM:"16GB DDR5", Storage:"1TB SSD", PSU:"650W SFX", Motherboard:"Z690 ITX"}},
      "9": {name: "Silent PC", requirements:{CPU:"Intel i5", GPU:"GTX 1650 Low Profile", RAM:"16GB DDR4", Storage:"1TB HDD", PSU:"500W Silent", Motherboard:"B560 DDR4"}},
      "10": {name: "Enthusiast Build", requirements:{CPU:"Threadripper", GPU:"RTX 4090", RAM:"128GB DDR5", Storage:"4TB SSD", PSU:"1600W", Motherboard:"TRX40"}}
    };

    // More components per category
    const componentsByCategory = {
      CPU: [
        {name:"Intel i3",img:"image/processor/Intel-Core-I3-12100F-Desktop-Processor.png"},
        {name:"Intel i5",img:"image/processor/Intel-Core-I5-13400F.png"},
        {name:"Intel i7",img:"image/processor/Intel-Core-I7-12700F-Desktop-Processor.png"},
        {name:"Intel i9",img:"image/processor/Intel-Core-I9-14900K.png"},
        {name:"Ryzen 5",img:"image/processor/Amd-Ryzen-5-5600X-Processor.png"},
        {name:"Ryzen 7",img:"image/processor/Amd-Ryzen-7-5800X-Processor.png"},
        {name:"Ryzen 9",img:"image/processor/Ryzen 9.jpg"},
        {name:"Threadripper",img:"image/processor/threadrippe.png"},
        {name:"Intel Xeon",img:"image/processor/intel-xeon.png"}
      ],
      GPU: [
        {name:"Integrated Graphics",img:"image/Graphics/Ryzen-5-4100.png"},
        {name:"GTX 1650 Low Profile",img:"image/Graphics/GTX-1650-Low-Profile.png"},
        {name:"GTX 1660",img:"image/Graphics/GTX-1660.png"},
        {name:"RTX 3060",img:"image/Graphics/RTX-3060.png"},
        {name:"RTX 3070",img:"image/Graphics/RTX-3070.png"},
        {name:"RTX 3080",img:"image/Graphics/RTX-3080.png"},
        {name:"RTX 4090",img:"image/Graphics/RTX-4090.png"},
        {name:"RTX A6000",img:"image/Graphics/RTX-A6000.png"}
      ],
      RAM: [
        {name:"8GB DDR4",img:"image/ram/8gb ddr4.png"},
        {name:"16GB DDR4",img:"image/ram/16gb ddr4.jpg"},
        {name:"32GB DDR4",img:"image/ram/32GB DDR4.png"},
        {name:"16GB DDR5",img:"image/ram/16GB DDR5.png"},
        {name:"32GB DDR5",img:"image/ram/32gb ddr5.jpg"},
        {name:"64GB DDR5",img:"image/ram/64gb ddr5.png"},
        {name:"128GB DDR5",img:"image/ram/128GB DDR5.png"}
      ],
      Storage: [
        {name:"256GB SSD",img:"image/storage/256GB SSD.png"},
        {name:"512GB SSD",img:"image/storage/512GB SSD.png"},
        {name:"1TB SSD",img:"image/storage/1TB SSD.png"},
        {name:"2TB SSD",img:"image/storage/2TB SSD.png"},
        {name:"4TB SSD",img:"image/storage/4TB SSD.png"},
        {name:"1TB HDD",img:"image/storage/1TB SSD.png"}
      ],
      PSU: [
        {name:"400W",img:"image/Power suppy/400W.png"},
        {name:"500W",img:"image/Power suppy/500W.png"},
        {name:"500W Silent",img:"image/Power suppy/500W Silent.png"},
        {name:"550W",img:"image/Power suppy/550w.jpg"},
        {name:"650W SFX",img:"image/Power suppy/650w.png"},
        {name:"750W",img:"image/Power suppy/750w.jpg"},
        {name:"850W",img:"image/Power suppy/850W.jpeg"},
        {name:"1000W",img:"image/Power suppy/1000W.jpeg"},
        {name:"1200W",img:"image/Power suppy/1200W.jpeg"},
        {name:"1600W",img:"image/Power suppy/1600.jpeg"}
      ],
      Motherboard: [
        {name:"H510 DDR4",img:"image/Motherboard/h510.jpeg"},
        {name:"B450 DDR4",img:"image/Motherboard/B450 DDR4.jpeg"},
        {name:"B560 DDR4",img:"image/Motherboard/B560.jpeg"},
        {name:"X570 DDR4",img:"image/Motherboard/X570.jpeg"},
        {name:"Z690 ITX",img:"image/Motherboard/Z690 ITX.jpeg"},
        {name:"Z790 DDR5",img:"image/Motherboard/Z790 DDR5.jpeg"},
        {name:"X670 DDR5",img:"image/Motherboard/X670 DDR5.jpeg"},
        {name:"WS C621",img:"image/Motherboard/WS C621.jpeg"},
        {name:"TRX40",img:"image/Motherboard/TRX40.jpeg"}
      ]
    };

    let currentScenario = null;

    function loadScenario(key) {
      currentScenario = scenarios[key];
      const compDiv = document.getElementById("components");
      compDiv.innerHTML = "<h2>Components</h2>";

      for (const category in componentsByCategory) {
        const catDiv = document.createElement("div");
        catDiv.className = "category";
        catDiv.innerHTML = `<h3>${category}</h3><div class="grid"></div>`;

        componentsByCategory[category].forEach(c => {
          const div = document.createElement("div");
          div.className = "component";
          div.draggable = true;
          div.dataset.type = category;
          div.dataset.name = c.name;
          div.innerHTML = `<img src="${c.img}" alt="${c.name}"><p>${c.name}</p>`;
          div.addEventListener("dragstart", dragStart);
          catDiv.querySelector(".grid").appendChild(div);
        });

        compDiv.appendChild(catDiv);
      }

      document.getElementById("result").innerText = `Loaded: ${currentScenario.name}`;
    }

    function randomScenario() {
      const keys = Object.keys(scenarios);
      const randomKey = keys[Math.floor(Math.random()*keys.length)];
      loadScenario(randomKey);
    }

    function dragStart(e) {
      e.dataTransfer.setData("type", e.target.dataset.type);
      e.dataTransfer.setData("name", e.target.dataset.name);
    }

    document.querySelectorAll(".slot").forEach(slot => {
      slot.addEventListener("dragover", e => {
        e.preventDefault();
        slot.classList.add("highlight");
      });
      slot.addEventListener("dragleave", () => slot.classList.remove("highlight"));
      slot.addEventListener("drop", e => {
        e.preventDefault();
        slot.classList.remove("highlight");
        const type = e.dataTransfer.getData("type");
        const name = e.dataTransfer.getData("name");
        if (slot.dataset.type === type) {
          slot.innerHTML = `<strong>${type}:</strong> ${name}`;
          slot.dataset.selected = name;
        } else {
          alert("Wrong slot! Place it in the correct slot.");
        }
      });
    });

    function checkBuild() {
      if (!currentScenario) {
        document.getElementById("result").innerText = "Please select a scenario first!";
        return;
      }
      let correct = true;
      document.querySelectorAll(".slot").forEach(slot => {
        if (slot.dataset.selected !== currentScenario.requirements[slot.dataset.type]) {
          correct = false;
        }
      });
      document.getElementById("result").innerText = correct
        ? "✅ Correct Build! Well done."
        : "❌ Incorrect Build. Try again!";
    }

     // ✅ Back to menu function
    function backToMenu() {
      window.location.href = "pcbuilder.html";
    }
  </script>
</body>
</html>
